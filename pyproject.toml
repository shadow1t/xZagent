[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xzagent"
dynamic = ["version"]
description = "Offline context packer for AI agents on local projects: repo map, import/call graph, relevant-file ranking. No internet, no API keys."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []

[project.scripts]
ctxp = "xzagent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = { attr = "xzagent.__version__" }